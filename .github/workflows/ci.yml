name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  spec:
    name: OpenAPI and JSON
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint

  verifiers:
    name: Webhook verifiers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Node.js
        run: node --test webhooks/node/verify.test.mjs
      - name: PHP
        run: |
          php -l webhooks/php/verify.php
          php webhooks/php/test.php
      - name: Python
        working-directory: webhooks/python
        run: python -m unittest -v

  scripts:
    name: curl scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck examples/curl/*.sh
